<!DOCTYPE html>

<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Register | Haven Market</title><link rel="stylesheet" href="css/style.css"></head>

<footer class="footer"><div class="container footer-inner"><a class="logo" href="index.html">HAVEN<span>.</span></a><p>© 2026 Haven Market. Student front-end project.</p></div></footer><script src="js/products.js"></script><script src="js/main.js"></script></body></html>
